name: Windows x86 SDK
on:
  push:
    paths:
      - 'scripts/build_windows_sdk.sh'
      - 'scripts/validate_windows.py'
      - 'scripts/test_windows_validation.py'
      - 'scripts/test_windows_sdk.py'
      - 'scripts/windows_sdk_smoke.cpp'
      - 'toolchain.env'
      - '.github/workflows/windows-x86-sdk.yml'
  pull_request:
    paths:
      - 'scripts/build_windows_sdk.sh'
      - 'scripts/validate_windows.py'
      - 'scripts/test_windows_validation.py'
      - 'scripts/test_windows_sdk.py'
      - 'scripts/windows_sdk_smoke.cpp'
      - 'toolchain.env'
      - '.github/workflows/windows-x86-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x86-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-sdk
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      REQUIRE_CCACHE: '1'
    steps:
      - uses: actions/checkout@v4
      # Compiler outputs are reusable across validator/smoke-only changes.
      # Keep this cache separate from the ESP executable-payload builds.
      - name: Restore SDK compiler cache
        id: sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: llvm-sdk-ccache-v1-${{ runner.os }}-i686-${{ hashFiles('toolchain.env', 'scripts/build_windows_sdk.sh') }}
          restore-keys: |
            llvm-sdk-ccache-v1-${{ runner.os }}-i686-
      - name: Install dependencies and pinned bootstrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache
          python3 scripts/test_windows_sdk.py
          source toolchain.env
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail -L --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$archive"
          printf '%s  %s\n' "$LLVM_MINGW_LINUX_X86_64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bootstrap"
          tar -xf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/bootstrap"
          echo "$RUNNER_TEMP/bootstrap/bin" >> "$GITHUB_PATH"
          python3 scripts/test_windows_validation.py "$RUNNER_TEMP/bootstrap"
      - name: Build LLVM 22 Windows x86 SDK
        id: sdk-build
        run: scripts/build_windows_sdk.sh
      - name: Show SDK compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
            du -sh "$CCACHE_DIR" || true
          fi
      - name: Save SDK compiler cache
        if: ${{ !cancelled() && steps.sdk-build.outcome != 'skipped' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: llvm-sdk-ccache-v1-${{ runner.os }}-i686-${{ hashFiles('toolchain.env', 'scripts/build_windows_sdk.sh') }}
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-windows-x86-sdk
          path: |
            dist/llvm-sdk-*.tar.xz
            dist/llvm-sdk-*.sha256
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: llvm-windows-x86-sdk
          path: artifacts
      - name: Verify and extract SDK and native x86 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          source toolchain.env
          echo "LLVM_WINDOWS_SDK_VERSION=$LLVM_WINDOWS_SDK_VERSION" >> "$GITHUB_ENV"
          cd artifacts
          sha256sum -c ./*.sha256
          tar -xf ./llvm-sdk-*.tar.xz
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-i686.zip"
          curl --fail -L --retry 3 -o bootstrap.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$archive"
          printf '%s  %s\n' "$LLVM_MINGW_WINDOWS_I686_SHA256" bootstrap.zip | sha256sum -c -
          7z x -y bootstrap.zip -obootstrap > /dev/null
          python ../scripts/validate_windows.py llvm-sdk i686-w64-mingw32 --native --llvm-version "$LLVM_WINDOWS_SDK_VERSION"
      - name: Execute x86 LLVM and link its C and C++ APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $PWD 'artifacts/llvm-sdk'
          $bootstrap = (Get-ChildItem artifacts/bootstrap -Directory | Select-Object -First 1).FullName
          $env:PATH = "$sdk/bin;$bootstrap/bin;$env:PATH"
          if ((& "$sdk/bin/llvm-config.exe" --version).Trim() -ne $env:LLVM_WINDOWS_SDK_VERSION) { throw 'Wrong LLVM version' }
          if ($LASTEXITCODE -ne 0) { throw 'The x86 LLVM executable failed' }
          $targets = & "$sdk/bin/llvm-config.exe" --targets-built
          foreach ($target in @('X86','ARM','AArch64','AVR','Mips','RISCV','WebAssembly')) {
            if ($targets -notmatch "\b$target\b") { throw "Missing LLVM target $target" }
          }
          $flags = ((& "$sdk/bin/llvm-config.exe" --cxxflags --link-static --ldflags --libs all --system-libs) -join ' ') -split '\s+'
          & "$bootstrap/bin/i686-w64-mingw32-clang++.exe" scripts/windows_sdk_smoke.cpp @flags -o artifacts/sdk-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Linking the x86 SDK C++ API failed' }
          & artifacts/sdk-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Executing the x86 SDK C/C++ API failed' }
