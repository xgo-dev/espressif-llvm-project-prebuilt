name: Build Espressif LLVM

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'release.sh'
      - 'toolchain.env'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
      - '**.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'release.sh'
      - 'toolchain.env'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (optional, uses current commit if empty)'
        required: false
        type: string
      upload:
        description: 'Upload release assets'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# Concurrency control to prevent multiple builds for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      llvm_ref: ${{ steps.vars.outputs.llvm_ref }}
      llvm_expected_version: ${{ steps.vars.outputs.llvm_expected_version }}
      upload: ${{ steps.vars.outputs.upload }}
      version_string: ${{ steps.vars.outputs.version_string }}

    steps:
    - name: Checkout payload contract
      uses: actions/checkout@v4

    - name: Determine tag and version
      id: vars
      run: |
        source toolchain.env
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
          # Tag push - create release
          tag="${{ github.ref_name }}"
          upload="true"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          # PR build - no release, use the checked-in payload contract.
          tag="$ESP_LLVM_PAYLOAD_VERSION"
          upload="false"
        elif [ "${{ github.event_name }}" = "push" ]; then
          # A main-branch build warms the trusted cache consumed by a later tag.
          tag="$ESP_LLVM_PAYLOAD_VERSION"
          upload="false"
        elif [ -n "${{ inputs.tag }}" ]; then
          # Manual trigger with tag
          tag="${{ inputs.tag }}"
          upload="${{ inputs.upload }}"
        else
          tag="$ESP_LLVM_PAYLOAD_VERSION"
          upload="${{ inputs.upload }}"
        fi

        version_string="esp-$tag"

        echo "tag=$tag" >> $GITHUB_OUTPUT
        echo "llvm_ref=$ESP_LLVM_SOURCE_REF" >> $GITHUB_OUTPUT
        echo "llvm_expected_version=$ESP_LLVM_EXPECTED_VERSION" >> $GITHUB_OUTPUT
        echo "upload=$upload" >> $GITHUB_OUTPUT
        echo "version_string=$version_string" >> $GITHUB_OUTPUT

        echo "Build configuration:"
        echo "  Event: ${{ github.event_name }}"
        echo "  Tag: $tag"
        echo "  LLVM source ref: $ESP_LLVM_SOURCE_REF"
        echo "  Expected LLVM version: $ESP_LLVM_EXPECTED_VERSION"
        echo "  Version String: $version_string"
        echo "  Upload: $upload"

  build:
    name: Build esp-clang for ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 build
          - target: x86_64-linux-gnu
            os: ubuntu-22.04
            runner: ubuntu-22.04
            container: ubuntu:20.04

          # Linux ARM64 build
          - target: aarch64-linux-gnu
            os: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            container: ubuntu:20.04

          # macOS x86_64 build
          - target: x86_64-apple-darwin
            os: macos-15-intel
            runner: macos-15-intel

          # macOS ARM64 build
          - target: aarch64-apple-darwin
            os: macos-14
            runner: macos-14

          # Windows x86-64 build. Espressif's supported build is a Linux-hosted
          # MinGW cross build; a separate native Windows job executes and
          # validates every packaged tool before release.
          - target: x86_64-w64-mingw32
            os: ubuntu-22.04
            runner: ubuntu-22.04

          # Native Windows ARM64 executables, cross-built with the same bootstrap.
          - target: aarch64-w64-mingw32
            os: ubuntu-22.04
            runner: ubuntu-22.04

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      REQUIRE_CCACHE: '1'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # A PR cache is isolated to that PR. Once merged, the main-branch build
    # publishes the trusted cache that a tag build may restore. Tag builds use
    # restore-only so they do not spend repository cache quota on tag-scoped
    # entries that future releases cannot reuse.
    - name: Restore ccache
      id: ccache-restore
      if: github.ref_type != 'tag'
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: esp-llvm-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('toolchain.env', 'release.sh', '.github/workflows/release.yml', 'patches/**') }}
        restore-keys: |
          esp-llvm-ccache-v1-${{ runner.os }}-${{ matrix.target }}-

    - name: Restore ccache for release
      if: github.ref_type == 'tag'
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: esp-llvm-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('toolchain.env', 'release.sh', '.github/workflows/release.yml', 'patches/**') }}
        restore-keys: |
          esp-llvm-ccache-v1-${{ runner.os }}-${{ matrix.target }}-

    - name: Install build dependencies (Linux containers)
      if: matrix.container == 'ubuntu:20.04'
      run: |
        export DEBIAN_FRONTEND=noninteractive
        
        # Use HTTP mirrors to avoid certificate issues
        sed -i 's|http://archive.ubuntu.com/ubuntu/|http://mirrors.kernel.org/ubuntu/|g' /etc/apt/sources.list
        sed -i 's|http://security.ubuntu.com/ubuntu/|http://mirrors.kernel.org/ubuntu/|g' /etc/apt/sources.list
        
        apt-get update --fix-missing
        apt-get install -y build-essential ninja-build git ca-certificates wget python3 python3-pip ccache
        
        # Install newer CMake (LLVM requires 3.20+, Ubuntu 20.04 has 3.16)
        CMAKE_VERSION="3.25.3"
        CMAKE_ARCH="x86_64"
        if [ "${{ matrix.target }}" = "aarch64-linux-gnu" ]; then
          CMAKE_ARCH="aarch64"
        fi
        
        echo "Matrix target: ${{ matrix.target }}"
        echo "CMAKE_ARCH: ${CMAKE_ARCH}"
        echo "Download URL: https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}.tar.gz"
        
        wget -O cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}.tar.gz"
        tar -xzf cmake.tar.gz -C /opt
        ln -sf /opt/cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}/bin/* /usr/local/bin/
        rm cmake.tar.gz
        cmake --version

    - name: Install build dependencies (Linux)
      if: startsWith(matrix.os, 'ubuntu-') && matrix.container != 'ubuntu:20.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build ccache

    - name: Install build dependencies (macOS)
      if: startsWith(matrix.os, 'macos-')
      run: |
        brew uninstall cmake || true
        brew install cmake ninja ccache

    - name: Install pinned LLVM 22 MinGW bootstrap
      if: endsWith(matrix.target, '-w64-mingw32')
      shell: bash
      run: |
        source toolchain.env
        archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
        url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}"
        curl -L --fail --retry 3 -o "$RUNNER_TEMP/$archive" "$url"
        printf '%s  %s\n' "$LLVM_MINGW_LINUX_X86_64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
        root="$RUNNER_TOOL_CACHE/llvm-mingw/$LLVM_MINGW_VERSION"
        mkdir -p "$root"
        tar -xf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$root"
        echo "$root/bin" >> "$GITHUB_PATH"
        python3 scripts/test_windows_validation.py "$root"

    - name: Build esp-clang package
      id: build
      shell: bash
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
        LLVM_REF: ${{ needs.prepare.outputs.llvm_ref }}
        LLVM_EXPECTED_VERSION: ${{ needs.prepare.outputs.llvm_expected_version }}
      run: ./release.sh ${{ matrix.target }}

    - name: Show ccache statistics
      if: always()
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then
          ccache --show-stats
          du -sh "$CCACHE_DIR" || true
        fi

    - name: Save ccache
      if: ${{ !cancelled() && github.ref_type != 'tag' && steps.build.outcome != 'skipped' && steps.ccache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: esp-llvm-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('toolchain.env', 'release.sh', '.github/workflows/release.yml', 'patches/**') }}

    - name: List generated packages
      shell: bash
      run: |
        echo "Generated packages:"
        ls -la dist/*.tar.xz 2>/dev/null || echo "No packages found in dist/"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}-esp-clang-packages
        path: |
          dist/*.tar.xz
          dist/*.sha256
        # Shorter retention for PR builds, longer for releases
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  validate-windows:
    name: Validate esp-clang for ${{ matrix.target }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            runner: windows-2022
          - target: aarch64-w64-mingw32
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout payload contract
      uses: actions/checkout@v4

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Download Windows payload
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.target }}-esp-clang-packages
        path: artifacts

    - name: Verify, extract, and execute payload
      shell: bash
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
        LLVM_REF: ${{ needs.prepare.outputs.llvm_ref }}
        LLVM_EXPECTED_VERSION: ${{ needs.prepare.outputs.llvm_expected_version }}
      run: |
        archive="artifacts/clang-esp-${TAG}-${{ matrix.target }}.tar.xz"
        checksum="$archive.sha256"
        expected="$(cut -d' ' -f1 "$checksum")"
        actual="$(sha256sum "$archive" | cut -d' ' -f1)"
        test "$actual" = "$expected"
        mkdir extracted
        tar -xf "$archive" -C extracted
        ./release.sh --validate "$PWD/extracted/esp-clang" ${{ matrix.target }}

  release:
    name: Create Release
    needs: [prepare, build, validate-windows]
    if: needs.prepare.outputs.upload == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        find artifacts -name "*.tar.xz" -exec mv {} . \;
        sha256sum *.tar.xz > "clang-esp-${{ needs.prepare.outputs.tag }}-checksum.sha256"
        echo "Release files:"
        ls -la *.tar.xz *.sha256

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        name: "Espressif LLVM ${{ needs.prepare.outputs.tag }}"
        draft: false
        prerelease: false
        files: |
          *.tar.xz
          *.sha256
        token: ${{ secrets.GITHUB_TOKEN }}
