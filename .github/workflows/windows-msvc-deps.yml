name: Windows MSVC dependencies

on:
  pull_request:
    paths:
      - 'windows-msvc-deps/**'
      - '.github/workflows/windows-msvc-deps.yml'
  push:
    branches: [llvm23]
    tags: ['llvm-msvc-deps-*']
    paths:
      - 'windows-msvc-deps/**'
      - '.github/workflows/windows-msvc-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check validation failure cases
        run: python windows-msvc-deps/test_build.py
      - name: Build and validate with the official LLVM SDK
        shell: pwsh
        run: ./windows-msvc-deps/run.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-msvc-deps-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: llvm-msvc-deps-*
          merge-multiple: true
          path: release-assets
      - name: Verify both qualified packages and the immutable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 windows-msvc-deps/verify_release.py release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          name: LLVM MSVC dependencies ${{ github.ref_name }}
          body: |
            Static zlib and zstd libraries for the official LLVM Windows MSVC SDK.
            Contains independent x64 and ARM64 Release /MT development packages.
            Both packages passed native LLVM compression and FileCheck link/run checks.
            These are host SDK dependencies; they are not Espressif target libraries.
          files: release-assets/*
